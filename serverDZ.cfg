// Exemple de configuration serveur DayZ pour le mod Werewolf (loup-garou).
// A adapter : nom, mots de passe, nombre de joueurs, mission.
// Lancement : DayZServer_x64.exe -config=serverDZ.cfg -port=2302 -profiles=profiles "-mod=@Werewolf" -dologs -adminlog -freezecheck

hostname = "Werewolf (Chernarus)";   // Nom du serveur
password = "";                       // Mot de passe pour se connecter (vide = serveur ouvert)
passwordAdmin = "";                  // Mot de passe administrateur : A RENSEIGNER avant d'ouvrir le serveur

maxPlayers = 60;                     // Nombre maximum de joueurs

verifySignatures = 2;                // Verifie les signatures des mods (cle WerewolfTest.bikey dans le dossier keys)
forceSameBuild = 1;                  // Refuse les clients d'une autre version du jeu

disableVoN = 0;                      // Voix en jeu activee
vonCodecQuality = 20;                // Qualite de la voix (0-30)

disable3rdPerson = 0;                // Vue a la troisieme personne autorisee
disableCrosshair = 0;                // Reticule autorise

// ---- Heure et date : important pour le mod ----
// Le loup-garou se transforme la nuit. En mode pleine lune (TransformMode = 1 dans
// WerewolfSettings.json), le mod lit la lune du jeu, qui depend de la DATE du serveur :
// la date doit avancer d'un redemarrage a l'autre, d'ou serverTimePersistent = 1.
// Attention : l'init.c des missions vanilla ramene la date entre le 20 septembre et le
// 20 octobre a chaque demarrage (bloc "DATE RESET AFTER ECONOMY INIT"). Pour que toutes
// les phases de lune reviennent au fil du temps, retirer ce bloc de l'init.c.
serverTime = "2026/9/20/12/00";      // Date et heure de depart (AAAA/MM/JJ/HH/MM), utilisee au premier demarrage
serverTimeAcceleration = 4;          // Vitesse du temps (4 = une journee de jeu en 6 h reelles)
serverNightTimeAcceleration = 2;     // Multiplicateur supplementaire la nuit (ici 8x : la nuit passe plus vite)
serverTimePersistent = 1;            // Le temps du serveur est sauvegarde et repris au redemarrage

guaranteedUpdates = 1;               // Protocole reseau (laisser a 1)

loginQueueConcurrentPlayers = 5;     // Joueurs traites en meme temps a la connexion
loginQueueMaxPlayers = 500;          // Taille maximale de la file d'attente

instanceId = 1;                      // Identifiant d'instance (dossier de sauvegarde storage_1)
lootHistory = 1;                     // Nombre de sauvegardes de persistance conservees
storeHouseStateDisabled = false;     // Persistance des portes et batiments
storageAutoFix = 1;                  // Remplace les fichiers de persistance corrompus

class Missions
{
    class DayZ
    {
        template = "dayzOffline.chernarusplus";   // Mission chargee au demarrage : <mission>.<carte>
    };
};
