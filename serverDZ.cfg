// Example DayZ server configuration for the Werewolf mod.
// Adapt: name, passwords, player count, mission.
// Launch: DayZServer_x64.exe -config=serverDZ.cfg -port=2302 -profiles=profiles "-mod=@Werewolf" -dologs -adminlog -freezecheck

hostname = "Werewolf (Chernarus)";   // Server name
password = "";                       // Password to join (empty = open server)
passwordAdmin = "";                  // Admin password: SET IT before opening the server

maxPlayers = 60;                     // Maximum number of players

verifySignatures = 2;                // Checks mod signatures (WerewolfTest.bikey in the keys folder)
forceSameBuild = 1;                  // Refuses clients running another game version

disableVoN = 0;                      // In-game voice enabled
vonCodecQuality = 20;                // Voice quality (0-30)

disable3rdPerson = 0;                // Third-person view allowed
disableCrosshair = 0;                // Crosshair allowed

// ---- Time and date: this matters for the mod ----
// The werewolf transforms at night. In full-moon mode (TransformMode = 1 in
// WerewolfSettings.json) the mod reads the moon of the game, which depends on the server
// DATE: the date has to move on from one restart to the next, hence serverTimePersistent = 1.
// Beware: the init.c of vanilla missions puts the date back between 20 September and
// 20 October at every start ("DATE RESET AFTER ECONOMY INIT" block). Remove that block
// from init.c if you want every moon phase to come round over time.
serverTime = "2026/9/20/12/00";      // Starting date and time (YYYY/MM/DD/HH/MM), used on the first start
serverTimeAcceleration = 4;          // Time speed (4 = one in-game day in 6 real hours)
serverNightTimeAcceleration = 2;     // Extra multiplier at night (8x here: nights go by faster)
serverTimePersistent = 1;            // Server time is saved and restored on restart

guaranteedUpdates = 1;               // Network protocol (leave at 1)

loginQueueConcurrentPlayers = 5;     // Players processed at the same time when connecting
loginQueueMaxPlayers = 500;          // Maximum size of the login queue

instanceId = 1;                      // Instance id (save folder storage_1)
lootHistory = 1;                     // Number of persistence backups kept
storeHouseStateDisabled = false;     // Persistence of doors and buildings
storageAutoFix = 1;                  // Replaces corrupted persistence files

class Missions
{
    class DayZ
    {
        template = "dayzOffline.chernarusplus";   // Mission loaded at startup: <mission>.<map>
    };
};
